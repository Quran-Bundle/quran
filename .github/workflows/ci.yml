name: Test

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-lang-arabic texlive-fonts-recommended

      - name: Increase TeX memory limit
        run: make increase_tex_memory

      - name: Run regression tests
        run: make check
