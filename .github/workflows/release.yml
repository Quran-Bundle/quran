name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs are handy to rebuild the release without moving a tag. The
  # optional input selects the tag or branch to build; without it the run uses
  # the ref it was started from.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build and release'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install TeX Live 2026 and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-lang-arabic \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            fonts-hosny-amiri \
            fonts-sil-scheherazade \
            fonts-noto-core \
            fonts-linuxlibertine

      - name: Check TeX Live version
        run: |
          xelatex --version
          tlmgr --version

      - name: Increase TeX memory limit
        run: |
          FILE=$(kpsewhich texmf.cnf)
          if ! grep -q '^main_memory *= *8000000' "$FILE"; then
            if grep -q '^main_memory *= *[0-9]\+' "$FILE"; then
              sudo sed -i 's/^main_memory *= *[0-9]\+/main_memory = 8000000/' "$FILE"
            else
              echo "main_memory = 8000000" | sudo tee -a "$FILE"
            fi
            sudo fmtutil-sys --all
          fi

      - name: Install development quran.sty
        run: |
          TEXMF_LOCAL=$(kpsewhich -var-value TEXMFLOCAL)
          sudo mkdir -p "$TEXMF_LOCAL/tex/latex/quran"
          sudo cp tex/*.def tex/quran.sty "$TEXMF_LOCAL/tex/latex/quran/"
          sudo mktexlsr

      - name: Build documentation
        run: make doc

      - name: Build CTAN package
        run: |
          make readme
          mkdir -p quran/doc quran/tex
          cp README quran/
          cp tex/quran.sty tex/*.def quran/tex/
          cp doc/quran-doc.pdf doc/quran-doc.tex doc/quran.png quran/doc/
          cp doc/quran-doc-ar.pdf doc/quran-doc-ar.tex quran/doc/
          cp sample/quran-test*.tex sample/quran-test*.pdf quran/doc/ 2>/dev/null || true
          zip -r quran.zip quran

      - name: Resolve release tag
        id: release
        run: |
          # A manual run starts from a branch, so github.ref_name would name a
          # release after that branch. Fall back to the version the package
          # itself declares, which makes a manual run reproduce the tagged run
          # of the current release.
          if [ -n "${{ inputs.ref }}" ]; then
            TAG="${{ inputs.ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(sed -n 's/.*quranversion{\([^}]*\)}.*/\1/p' tex/quran.sty)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            doc/quran-doc.pdf
            doc/quran-doc-ar.pdf
            quran.zip
